name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Typecheck, lint, test e build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Só gera o client do Prisma a partir do schema — não precisa de
      # DATABASE_URL real nem de conexão com banco (ver docs/adr/ADR-021).
      - name: Gerar Prisma Client
        run: npm run generate --workspace packages/database

      - name: Typecheck (todos os workspaces)
        run: npm run typecheck --workspaces --if-present

      - name: Lint (todos os workspaces)
        run: npm run lint --workspaces --if-present

      - name: Testes unitários (todos os workspaces)
        run: npm run test --workspaces --if-present

      - name: Build de produção (todos os workspaces)
        run: npm run build --workspaces --if-present
